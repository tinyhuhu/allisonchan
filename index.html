<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chicken Butt</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
    }

    .hero {
      display: block;
      width: 60%;
      max-width: 1200px;
      height: auto;
      margin: 2rem auto 0;
    }

    h1 {
      margin: 1rem 1rem;
      color: blue;
      font-size: 35px;
      line-height: 1;
    }

    .scrolling-ad {
      width: 100%;
      overflow: hidden;
      padding: 12px 0;
      background: #004b85;
      border-top: 3px solid #073b66;
      border-bottom: 3px solid #073b66;
    }

    .scrolling-ad__track {
      display: flex;
      width: max-content;
      animation: scroll-ads 80s linear infinite;
      will-change: transform;
    }

    .scrolling-ad:hover .scrolling-ad__track {
      animation-play-state: paused;
    }

    .scrolling-ad__group {
      display: flex;
      flex: none;
      align-items: center;
      gap: clamp(14px, 2vw, 28px);
      padding-right: clamp(14px, 2vw, 28px);
    }

    .scrolling-ad__image {
      display: block;
      width: clamp(76px, 8vw, 108px);
      height: clamp(76px, 8vw, 108px);
      flex: none;
      object-fit: cover;
      border: 3px solid rgb(255 255 255 / 85%);
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 3px 10px rgb(0 0 0 / 28%);
    }

    @keyframes scroll-ads {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .scrolling-ad {
        overflow-x: auto;
      }

      .scrolling-ad__track {
        animation: none;
      }

      .scrolling-ad__group[aria-hidden="true"] {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1><font color=red>~~Xiao Miao!~~</font></h1>
    <img class="hero" src="xiaomiao.jpg" alt="Xiao Miao!">
    <br>
